server:
  port: 8080
  error:
    whitelabel:
      enabled: false
spring:
  r2dbc:
    url: r2dbc:mysql://localhost:3306/auth_db
    username: root
    password: admin
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
    sql:
      init:
        mode: always
  application:
    name: "powerup-crediya-authentication"
  devtools:
    add-properties: false
  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

# JWT Configuration
jwt:
  secret: "mySecretKey12345678901234567890123456789012345678901234567890"
  expiration: 86400000 # 24 horas en milisegundos

# API Paths Configuration
api:
  paths:
    usuarios:
      base: "/api/v1/usuarios"
      validar-existencia-usuario: "/api/v1/usuarios/validar-existencia"
    roles: "/api/v1/roles"
    auth:
      login: "/api/v1/login"

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  info:
    title: "Crediya Authenticacion API"
    description: "API para la gestion de usuarios y roles de crediya"
    version: "1.0.0"
    contact:
      name: "Felipe Tellez"
      email: "juanfelipetellezacosta@gmail.com"
